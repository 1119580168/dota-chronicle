name: 功能建议
description: 提出使用需求或兼容性建议
title: "[Feature] "
body:
  - type: textarea
    id: need
    attributes:
      label: 希望解决的使用问题
      description: 描述实际场景，以及目前操作中的困难。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的行为
      description: 可说明版本、地图或操作方式；请勿附游戏资源。
    validations:
      required: true
