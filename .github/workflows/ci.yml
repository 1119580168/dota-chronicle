name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run build
      - run: npm run test:ui
      - run: npm run pack -- --config.electronDist=node_modules/electron/dist
      # Local checks only: no upload, release publishing or signing secrets.
