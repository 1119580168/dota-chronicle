<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Dota Chronicle · DOTA 2 编年馆</title>
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="assets/lucide.js"></script>
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="boot">CHRONICLE <span>正在读取本地档案…</span></div>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="mediaViewer" aria-label="档案影像"><div id="mediaViewerBody"></div></dialog>
    <dialog id="confirm">
      <form method="dialog">
        <span class="eyebrow">END SESSION</span>
        <h2>结束本次运行？</h2>
        <p>
          此操作会关闭本启动器启动的游戏或房间。房间内的玩家将断开连接，临时
          Steam 路由与活动挂载会在退出后恢复。
        </p>
        <div class="dialog-actions">
          <button value="cancel" class="button ghost">继续运行</button
          ><button value="stop" class="button primary">结束运行</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
